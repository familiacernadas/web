name: Actualizar LaLiga 2026-27

on:
  workflow_dispatch:
  schedule:
    # 05:17 UTC ≈ 07:17 en España peninsular durante horario de verano.
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Actualizar datos LaLiga
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/update_laliga.mjs

      - name: Publicar JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/laliga_2026_27.json
          git diff --cached --quiet || git commit -m "Actualizar datos LaLiga 2026/27"
          git push

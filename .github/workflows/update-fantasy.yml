name: Actualizar LaLiga Fantasy 2026-27

on:
  workflow_dispatch:
  schedule:
    - cron: "27 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Actualizar datos Fantasy
        run: node scripts/update_fantasy.mjs
      - name: Publicar JSON Fantasy actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fantasy_2026_27.json
          git diff --cached --quiet || git commit -m "Actualizar datos LaLiga Fantasy 2026/27"
          git push
